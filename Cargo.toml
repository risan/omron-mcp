[package]
name = "omron-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OMRON blood pressure MCP server for the Claude apps"
publish = false

[workspace]
members = ["crates/omron-connect"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[lib]
name = "omron_mcp"
path = "src/lib.rs"

[[bin]]
name = "omron-mcp"
path = "src/main.rs"

[features]
# Env-driven hooks the subprocess and load tests need; never in the production build.
testhooks = []
# The manual live test against a real OMRON account.
live = []

[dependencies]
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde", "tzdb-bundle-always"] }
libc = "0.2.191"
mcp-starter = "0.1.5"
# no_thp: no MADV_HUGEPAGE on its arena, or 2 MiB huge pages inflate the RSS on hosts with THP "madvise".
mimalloc = { version = "0.1.52", features = ["no_thp"] }
omron-connect = { path = "crates/omron-connect", version = "0.1.0" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "signal", "sync", "macros"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[dev-dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
mcp-starter = { version = "0.1.5", features = ["test-support"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
sha2 = "0.11.1"
tempfile = "3.27.0"

[build-dependencies]
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
