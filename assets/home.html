<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omron-mcp: OMRON blood pressure for Claude and ChatGPT</title>
<meta name="description" content="A single-binary MCP server that lets Claude and ChatGPT read your OMRON connect blood pressure readings.">
<link rel="icon" href="/favicon.ico">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --fg: #1f2328;
  --border: #d1d9e0;
  --code-bg: #f3f4f6;
  --link: #0969da;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1216;
    --fg: #e6e8eb;
    --border: #2f3640;
    --code-bg: #1a1f26;
    --link: #58a6ff;
  }
}

body {
  margin: 0 auto;
  padding: 1.5rem 1rem 4rem;
  max-width: 46rem;
  background: var(--bg);
  color: var(--fg);
  font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

h1, h2, h3 {
  line-height: 1.25;
}

h2 {
  margin-top: 2.5rem;
  padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--border);
}

a {
  color: var(--link);
}

code, pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.875em;
}

code {
  padding: 0.1em 0.35em;
  border-radius: 4px;
  background: var(--code-bg);
}

pre {
  padding: 0.75rem 1rem;
  overflow-x: auto;
  border-radius: 6px;
  background: var(--code-bg);
  line-height: 1.45;
}

pre code {
  padding: 0;
  background: none;
}

table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
}

th, td {
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  text-align: left;
  vertical-align: top;
}

th {
  background: var(--code-bg);
}

section#setup {
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--border);
}
</style>
</head>
<body>
{{content}}
</body>
</html>
